<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — SecureHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo">S</div>
            <h1>Set New Password</h1>
            <p>Create a new password for account: <strong>{{ user.username }}</strong></p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password') }}" class="auth-form">
            <input type="hidden" name="token" value="{{ token or '' }}">
            <input type="hidden" name="target_user_id" value="{{ user.id }}">

            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" minlength="3" required autofocus>
                <span class="form-hint">Minimum 3 characters.</span>
            </div>

            <div class="form-group" style="margin-top: 16px;">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary btn-block">Update Password</button>
            </div>

            <div style="margin-top: 18px; text-align: center;">
                <a href="{{ url_for('login') }}" style="font-size: 13px; color: var(--primary); text-decoration: none;">&larr; Cancel and Sign In</a>
            </div>
        </form>
    </div>
</body>
</html>
